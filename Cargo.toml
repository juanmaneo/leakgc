[package]
name = "win-games-leak-garbage-collector"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "leakgc"
path = "src/main.rs"

[workspace]
members = [".", "xtask"]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[lints]
workspace = true

[dependencies]
libc = "0.2.189"
nix = { version = "0.31.2", default-features = false, features = ["process", "signal", "ptrace"] }
seccompiler = "0.5.0"
